services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mawrid
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmawrid"]
      interval: 5s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/mawrid?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASS: mawrid
    ports:
      - "8080:8080"
volumes:
  dbdata:
