# Render Blueprint: one MySQL private service (with disk) + the Mawrid web service.
services:
  - type: pserv
    name: mawrid-db
    runtime: docker
    dockerfilePath: ./db/Dockerfile
    dockerContext: ./db
    plan: starter
    disk:
      name: mawrid-db-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_DATABASE
        value: mawrid
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: mawrid
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MYSQLHOST
        fromService:
          type: pserv
          name: mawrid-db
          property: host
      - key: MYSQLPORT
        value: "3306"
      - key: MYSQLDATABASE
        value: mawrid
      - key: MYSQLUSER
        value: root
      - key: MYSQLPASSWORD
        fromService:
          type: pserv
          name: mawrid-db
          envVarKey: MYSQL_ROOT_PASSWORD
      - key: ADMIN_PASSWORD
        sync: false
